name: DGPA online verification (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Check discovery parser fixtures
        run: python scripts/test_fetch_dgpa.py
      - name: Download real DGPA attachments
        run: python scripts/fetch_dgpa.py
      - name: Parse downloaded Excel and validate dates
        run: |
          python scripts/build_calendar.py
          python scripts/test_calendar.py
      - name: Show result without publishing
        run: |
          git status --short
          echo 'Verification only: NO commit, NO push, NO Pages deployment.'
